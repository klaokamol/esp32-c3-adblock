[platformio]
default_envs = c3

[env]
platform = espressif32@8.0.0
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev
build_flags = -Os

[env:c3]
board = esp32-c3-devkitm-1
lib_deps = adafruit/Adafruit SSD1306@^2.5.0
build_flags =
    -Os
    -DUSE_OLED
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
